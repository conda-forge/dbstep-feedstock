{% set name = "dbstep" %}
{% set version = "1.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 379e4c732e403c43f277ef06f899f64aa7fe5221b4092d3bca4185a109c2cd3c

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - cclib
    - numba
    - numpy
    - python >=3.6
    - scipy >=1.6

test:
  imports:
    - dbstep
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/patonlab/DBSTEP
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: 'DFT Based Steric Parameters'

extra:
  recipe-maintainers:
    - luchini18
