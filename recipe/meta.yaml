{% set name = "dbstep" %}
{% set version = "2.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9287348aa679db776400855dd392c853385af622b2c5e4b2f41bc1595830f7a3

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - cclib
    - numba
    - numpy
    - python >=3.6
    - scipy >=1.6

test:
  imports:
    - dbstep
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/patonlab/DBSTEP
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: 'DFT Based Steric Parameters'

extra:
  recipe-maintainers:
    - luchini18
